<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TecnoFit - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <h1>TecnoFit</h1>
  <p>Monitoreo Deportivo y Wearables</p>
</header>

<main class="container">
  <section class="card card-login">
    <h2>Iniciar Sesión</h2>


    <div id="mensajeGlobalError" class="alert-danger" style="display: none;"></div>

    <form id="loginForm" novalidate>

      <div class="form-group">
        <label for="loginEmail">Correo Electrónico Institucional *</label>
        <input type="email" id="loginEmail" name="loginEmail" required
               placeholder="usuario@duoc.cl o usuario@profesor.duoc.cl">
        <small class="error-msg" id="errorLoginEmail"></small>
      </div>


      <div class="form-group">
        <label for="loginPassword">Contraseña *</label>
        <input type="password" id="loginPassword" name="loginPassword" required placeholder="********">
        <small class="error-msg" id="errorLoginPassword"></small>
      </div>


      <div class="form-actions">
        <button type="submit" class="btn-primary">Ingresar</button>
      </div>

      <p class="login-link">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </form>
  </section>
</main>

<script src="js/login.js"></script>
</body>
</html>
